<template id="route-card-template">
    <article class="route-card overflow-hidden" data-route-card>
        <button class="w-full p-4 text-left" type="button" data-route-select aria-pressed="false">
            <span class="flex items-start justify-between gap-3">
                <span class="flex min-w-0 items-start gap-3">
                    <span class="route-swatch mt-1 size-3 shrink-0 rounded-full bg-surface-strong" aria-hidden="true"></span>
                    <span class="min-w-0">
                        <span class="flex flex-wrap gap-1.5" data-route-badges></span>
                        <span class="mt-1 block text-sm font-extrabold text-ink" data-route-title></span>
                    </span>
                </span>
                <span class="shrink-0 text-right">
                    <span class="block text-base font-extrabold text-ink" data-route-distance></span>
                    <span class="block text-[0.68rem] font-semibold text-ink-muted">road distance</span>
                </span>
            </span>

            <span class="mt-4 grid grid-cols-3 gap-2 rounded-xl bg-surface-subtle p-3">
                <span>
                    <span class="block text-[0.65rem] font-bold uppercase tracking-wider text-ink-muted">Est. time</span>
                    <span class="mt-1 block text-sm font-extrabold text-ink" data-route-duration></span>
                </span>
                <span>
                    <span class="block text-[0.65rem] font-bold uppercase tracking-wider text-ink-muted">Record score</span>
                    <span class="mt-1 block text-sm font-extrabold text-ink" data-route-safety></span>
                </span>
                <span>
                    <span class="block text-[0.65rem] font-bold uppercase tracking-wider text-ink-muted">Proximity risk</span>
                    <span class="mt-1 block text-sm font-extrabold text-ink" data-route-risk></span>
                </span>
            </span>

            <span class="mt-3 block text-xs leading-5 text-ink-muted" data-route-explanation></span>
            <span class="mt-1 block text-[0.68rem] leading-4 text-ink-muted" data-route-coverage></span>
            <span class="mt-3 flex items-center justify-between gap-3 border-t border-line pt-3">
                <span class="text-[0.68rem] font-semibold text-ink-muted" data-route-algorithm></span>
                <span class="text-xs font-extrabold text-accent-strong" data-route-action>View route</span>
            </span>
        </button>
    </article>
</template>
