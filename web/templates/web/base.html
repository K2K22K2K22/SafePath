{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Compare shorter and safety-aware road routes with transparent incident-based scoring.">
    <link rel="icon" href="{% static 'web/images/favicon.svg' %}" type="image/svg+xml">
    <title>{% block title %}SAFE PATH{% endblock %}</title>

    <script>
        (() => {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem("safepath-theme");
            } catch (error) {
                savedTheme = null;
            }
            const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = savedTheme || preferredTheme;
        })();
    </script>

    <link rel="stylesheet" href="{% static 'web/vendor/leaflet/leaflet.css' %}">
    <link rel="stylesheet" href="{% static 'web/css/app.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-canvas text-ink antialiased">
    <header class="border-b border-line bg-surface">
        <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
            <a class="flex items-center gap-3 rounded-lg" href="{% url 'Home' %}" aria-label="SAFE PATH home">
                <span class="grid size-10 place-items-center rounded-xl bg-accent text-white shadow-sm" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s7-5.1 7-12A7 7 0 1 0 5 9c0 6.9 7 12 7 12Z"/>
                        <circle cx="12" cy="9" r="2.2"/>
                    </svg>
                </span>
                <span>
                    <span class="block text-sm font-extrabold tracking-[0.14em] text-ink">SAFE PATH</span>
                    <span class="hidden text-xs text-ink-muted sm:block">Choose your route with context</span>
                </span>
            </a>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="secondary-button" type="button" aria-label="Switch to dark theme" aria-pressed="false">
                    <span class="theme-icon-sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
                    </span>
                    <span class="theme-icon-moon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
                    </span>
                    <span class="hidden sm:inline" data-theme-label>Dark</span>
                </button>
                <span class="status-pill hidden sm:inline-flex" data-tone="success">
                    <span class="size-1.5 rounded-full bg-accent" aria-hidden="true"></span>
                    Bundled incident data
                </span>
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    <script src="{% static 'web/vendor/leaflet/leaflet.js' %}"></script>
    <script src="{% static 'web/vendor/leaflet-heat/leaflet-heat.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
