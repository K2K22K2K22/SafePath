name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://safepath:safepath@127.0.0.1:5432/safepath
      DJANGO_DEBUG: "True"
      SAFEPATH_DATABASE_CONN_MAX_AGE: "60"
      SAFEPATH_PYTHON: python

    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_DB: safepath
          POSTGRES_PASSWORD: safepath
          POSTGRES_USER: safepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safepath -d safepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install --requirement requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy Model web safepath_backend scripts manage.py

      - name: Django checks and PostgreSQL migrations
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check
          python -m compileall -q Model web safepath_backend manage.py

      - name: Django tests
        run: python manage.py test --verbosity 2

      - name: Frontend build and lint
        run: |
          npm run build:css
          git diff --exit-code -- web/static/web/css/app.css
          npm run lint:js
          npm run check:js

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Docker Compose configuration
        run: |
          trap 'rm -f .env' EXIT
          cp .env.example .env
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-secret/' .env
          sed -i 's/^PORT=.*/PORT=9000/' .env
          docker compose config --format json > /tmp/safepath-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/safepath-compose.json").read_text())
          django = config["services"]["django"]
          assert django["environment"]["PORT"] == "9000"
          assert django["ports"][0]["target"] == 9000
          assert django["ports"][0]["published"] == "9000"
          assert django["environment"]["SAFEPATH_DATABASE_PATH"] == "/data/db.sqlite3"
          assert django["environment"]["SAFEPATH_RUN_MIGRATIONS"] == "true"
          assert django["volumes"][0]["source"] == "safepath_data"
          assert django["stop_grace_period"] == "40s"
          assert django["depends_on"]["data-init"]["condition"] == "service_completed_successfully"
          assert config["services"]["data-init"]["user"] == "0:0"
          assert config["services"]["data-init"]["entrypoint"] == [
              "chown", "-R", "10001:10001", "/data"
          ]
          PY

      - name: Docker Compose startup
        run: |
          trap 'docker compose down --volumes; rm -f .env' EXIT
          export COMPOSE_PROJECT_NAME=safepath-ci
          cp .env.example .env
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-secret/' .env
          docker compose build
          docker volume create \
            --label com.docker.compose.project=safepath-ci \
            --label com.docker.compose.volume=safepath_data \
            safepath-ci_safepath_data
          image_id="$(docker compose images -q django)"
          docker run --rm --user root \
            --volume safepath-ci_safepath_data:/data \
            "$image_id" touch /data/legacy-root-owned
          docker compose up --detach
          for attempt in {1..60}; do
            container_status="$(docker inspect --format '{{.State.Status}}' safepath_django)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath_django)"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$container_status" = "exited" ] || [ "$health_status" = "unhealthy" ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath_django)"
          if [ "$health_status" != "healthy" ]; then
            docker compose logs
            exit 1
          fi
          docker compose exec -T django python - <<'PY'
          import os
          from pathlib import Path

          status = Path("/proc/1/status").read_text()
          uid = next(line.split()[1] for line in status.splitlines() if line.startswith("Uid:"))
          assert uid == "10001", uid
          command = Path("/proc/1/cmdline").read_bytes().split(b"\0")
          assert any(b"gunicorn" in part for part in command), command
          assert os.readlink("/proc/1/fd/1") == os.readlink("/proc/1/fd/2")
          legacy = os.stat("/data/legacy-root-owned")
          assert (legacy.st_uid, legacy.st_gid) == (10001, 10001)
          PY
          test ! -e db.sqlite3
          docker compose exec -T django test -s /data/db.sqlite3
          docker compose exec -T django python manage.py migrate --check
          docker compose cp \
            django:/app/staticfiles/staticfiles.json /tmp/safepath-staticfiles.json
          python scripts/verify_static_assets.py \
            --base-url http://127.0.0.1:8000 \
            --manifest /tmp/safepath-staticfiles.json
          docker compose stop django
          test "$(docker inspect --format '{{.State.ExitCode}}' safepath_django)" = "0"

      - name: Docker build and health check
        run: |
          docker build --tag safepath-ci .
          docker run --detach --name safepath-ci \
            --env DJANGO_SECRET_KEY=ci-only-secret \
            --env DJANGO_ALLOWED_HOSTS=safepath.example.com \
            --env SAFEPATH_RUN_MIGRATIONS=true \
            --publish 8000:8000 safepath-ci
          for attempt in {1..60}; do
            container_status="$(docker inspect --format '{{.State.Status}}' safepath-ci)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath-ci)"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$container_status" = "exited" ] || [ "$health_status" = "unhealthy" ]; then
              docker logs safepath-ci
              exit 1
            fi
            sleep 2
          done
          health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath-ci)"
          if [ "$health_status" != "healthy" ]; then
            docker logs safepath-ci
            exit 1
          fi
          docker exec safepath-ci test -s /data/db.sqlite3 || {
            docker logs safepath-ci
            exit 1
          }
          docker exec safepath-ci test -f /app/staticfiles/staticfiles.json || {
            docker logs safepath-ci
            exit 1
          }
          docker cp \
            safepath-ci:/app/staticfiles/staticfiles.json /tmp/safepath-staticfiles.json
          python scripts/verify_static_assets.py \
            --base-url http://127.0.0.1:8000 \
            --manifest /tmp/safepath-staticfiles.json
          docker exec safepath-ci python manage.py migrate --check || {
            docker logs safepath-ci
            exit 1
          }
          docker exec -i safepath-ci python - <<'PY'
          import os
          from pathlib import Path

          status = Path("/proc/1/status").read_text()
          uid = next(line.split()[1] for line in status.splitlines() if line.startswith("Uid:"))
          assert uid == "10001", uid
          command = Path("/proc/1/cmdline").read_bytes().split(b"\0")
          assert any(b"gunicorn" in part for part in command), command
          assert os.readlink("/proc/1/fd/1") == os.readlink("/proc/1/fd/2")
          PY

          docker run --detach --name safepath-ci-no-migrations \
            --env DJANGO_SECRET_KEY=ci-only-secret \
            --env DJANGO_ALLOWED_HOSTS=safepath.example.com \
            --env SAFEPATH_RUN_MIGRATIONS=false \
            safepath-ci
          for attempt in {1..60}; do
            container_status="$(docker inspect --format '{{.State.Status}}' safepath-ci-no-migrations)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath-ci-no-migrations)"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$container_status" = "exited" ] || [ "$health_status" = "unhealthy" ]; then
              docker logs safepath-ci-no-migrations
              exit 1
            fi
            sleep 2
          done
          health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath-ci-no-migrations)"
          if [ "$health_status" != "healthy" ]; then
            docker logs safepath-ci-no-migrations
            exit 1
          fi
          migration_state="$(docker exec safepath-ci-no-migrations python manage.py showmigrations --plan)"
          if printf '%s\n' "$migration_state" | grep -q '\[X\]'; then
            docker logs safepath-ci-no-migrations
            exit 1
          fi
          docker stop --timeout 40 safepath-ci-no-migrations
          test "$(docker inspect --format '{{.State.ExitCode}}' safepath-ci-no-migrations)" = "0"

          set +e
          docker run --rm \
            --env DJANGO_SECRET_KEY=ci-only-secret \
            --env DJANGO_ALLOWED_HOSTS=safepath.example.com \
            --env SAFEPATH_RUN_MIGRATIONS=invalid \
            safepath-ci
          invalid_mode_status=$?
          set -e
          test "$invalid_mode_status" -eq 64

          set +e
          docker run --rm \
            --env DJANGO_SECRET_KEY=ci-only-secret \
            --env DJANGO_ALLOWED_HOSTS=safepath.example.com \
            --env SAFEPATH_RUN_MIGRATIONS=false \
            --env GUNICORN_GRACEFUL_TIMEOUT=30 \
            --env DOCKER_STOP_GRACE_PERIOD=30 \
            safepath-ci
          invalid_grace_status=$?
          set -e
          test "$invalid_grace_status" -eq 64

          docker stop --timeout 40 safepath-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' safepath-ci)" = "0"
