name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "True"
      SAFEPATH_PYTHON: python

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install --requirement requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy Model web safepath_backend manage.py

      - name: Django checks and tests
        run: |
          python manage.py check
          python manage.py test --verbosity 2
          python -m compileall -q Model web safepath_backend manage.py

      - name: Frontend build and lint
        run: |
          npm run build:css
          git diff --exit-code -- web/static/web/css/app.css
          npm run lint:js
          npm run check:js

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Docker build and health check
        run: |
          docker build --tag safepath-ci .
          docker run --detach --name safepath-ci \
            --env DJANGO_SECRET_KEY=ci-only-secret \
            --env DJANGO_ALLOWED_HOSTS=safepath.example.com \
            --publish 8000:8000 safepath-ci
          for attempt in {1..60}; do
            container_status="$(docker inspect --format '{{.State.Status}}' safepath-ci)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath-ci)"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$container_status" = "exited" ] || [ "$health_status" = "unhealthy" ]; then
              docker logs safepath-ci
              exit 1
            fi
            sleep 2
          done
          health_status="$(docker inspect --format '{{.State.Health.Status}}' safepath-ci)"
          if [ "$health_status" != "healthy" ]; then
            docker logs safepath-ci
            exit 1
          fi
          curl --fail --silent --output /dev/null \
            http://127.0.0.1:8000/static/web/vendor/leaflet/leaflet.js
          curl --fail --silent --output /dev/null \
            http://127.0.0.1:8000/static/web/css/app.css
          docker exec safepath-ci python manage.py migrate --check
